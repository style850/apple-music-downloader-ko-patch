<!doctype html>
<!-- Modified 2026-11-08 for Korean UI; see docs/PATCH-ATTRIBUTION.ko.md. -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; style-src 'self'; script-src 'self'"><title>Apple Music 로그인</title><link rel="stylesheet" href="native.css"><link rel="stylesheet" href="native-motion.css"></head>
<body class="login-page"><main class="login-content"><img class="music-mark" src="../assets/app-icon.png" alt="" width="48" height="48"><h1>Apple Music 로그인</h1><p id="login-status" role="status">로그인 세션을 확인하는 중…</p>
<form id="login-form"><div id="account-fields"><label>Apple 계정<input id="login-email" type="text" autocomplete="username" maxlength="512" required></label><label>암호<input id="login-password" type="password" autocomplete="current-password" maxlength="4096" required></label></div><label id="code-field" hidden>인증 코드<input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label><button id="login-submit" class="primary" type="submit">로그인</button></form>
<section id="auth-interaction" hidden aria-live="polite"><h2 id="interaction-title"></h2><p id="interaction-message" class="interaction-message"></p><p id="interaction-note"></p><details id="interaction-original" hidden><summary>Apple 원문 안내 보기</summary><p id="interaction-original-text" class="interaction-message"></p></details><form id="interaction-form"><div id="interaction-fields"></div><div id="interaction-buttons" class="interaction-buttons"></div></form><p id="interaction-error" class="error" role="alert"></p><p id="interaction-expiry" class="muted"></p></section>
<details id="two-factor-help" class="verification-help" hidden><summary>기기 인증 코드를 받지 못했나요?</summary><div class="verification-help-content"><p>같은 Apple 계정으로 로그인한 신뢰할 수 있는 기기에서 이번 로그인을 승인한 뒤 6자리 코드를 확인하세요.</p><p>이번 로그인에서 받은 코드만 입력하고 다른 로그인 세션의 코드는 사용하지 마세요.</p></div></details>
<div class="login-actions"><button id="login-recheck" type="button">세션 다시 확인</button><button id="login-cancel" type="button">나중에 로그인</button></div><p id="login-error" class="error" role="alert"></p></main><script src="native-motion.js"></script><script src="native-account-input.js"></script><script src="native-login.js"></script><script src="native-auth-presentation.js"></script><script src="native-auth-interaction.js"></script></body></html>
