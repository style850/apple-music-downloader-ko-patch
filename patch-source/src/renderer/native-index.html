<!doctype html>
<!-- Modified 2026-11-08 for Korean UI; see docs/PATCH-ATTRIBUTION.ko.md. -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; img-src 'self' data: amdl-artwork: https://*.mzstatic.com; media-src blob: http://127.0.0.1:* https://*.mzstatic.com https://audio-ssl.itunes.apple.com; style-src 'self'; script-src 'self'"><title>Music</title><link rel="stylesheet" href="native.css"><link rel="stylesheet" href="native-shell.css"><link rel="stylesheet" href="native-motion.css"></head>
<body class="native-shell">
<header id="app-header">
  <div class="window-brand"><button id="browse-back" type="button" aria-label="이전 페이지" title="이전 페이지(Esc)" disabled>←</button><img class="brand-mark" src="../assets/app-icon.png" alt="" width="21" height="21"><span class="app-name">Music 다운로더</span><button id="nav-toggle" aria-label="사이드바 펼치기" aria-expanded="false" title="사이드바 전환"><span data-icon="sidebar"></span></button></div>
  <div class="app-header-right"><button id="download-monitor" aria-label="다운로드 진행률 보기"><span class="monitor-icon" data-icon="download"></span><span class="monitor-copy"><strong id="monitor-title">다운로드 상태</strong><span id="monitor-detail">다운로드 서비스에 연결하는 중…</span></span><span id="monitor-speed">—</span><progress id="monitor-progress" max="1" value="0" aria-label="현재 작업의 트랙 진행률"></progress></button><select id="region" aria-label="카탈로그 지역"><option value="us">미국</option><option value="cn">중국 본토</option><option value="hk">홍콩</option><option value="tw">대만</option><option value="jp">일본</option><option value="gb">영국</option></select><button id="refresh-catalog" aria-label="현재 카탈로그 새로 고침" title="카탈로그 새로 고침"><span data-icon="refresh"></span></button></div>
</header>
<aside id="sidebar">
  <button id="sidebar-search-toggle" aria-label="검색 펼치기" title="검색"><span data-icon="search"></span></button>
  <form id="search-form" role="search"><input id="search-input" type="search" placeholder="검색" aria-label="Apple Music 검색"><button type="submit" aria-label="검색"><span data-icon="search"></span></button></form>
  <div class="sidebar-scroll"><nav aria-label="기본 탐색">
    <button data-feed="home" aria-label="홈 추천" class="selected" aria-current="page"><span data-icon="home"></span><span class="nav-label">홈</span></button>
    <button data-feed="discover" aria-label="새로운 발견"><span data-icon="grid"></span><span class="nav-label">새로운 발견</span></button>
    <button data-feed="library" aria-label="내 플레이리스트"><span data-icon="library"></span><span class="nav-label">내 플레이리스트</span></button>
    <span class="sidebar-section nav-label">다운로드 및 관리</span>
    <button data-view="tasks" aria-label="다운로드 작업"><span data-icon="download"></span><span class="nav-label">다운로드 작업</span><span id="sidebar-job-count" class="nav-count" hidden></span></button>
    <button data-view="settings" aria-label="설정 및 상태"><span data-icon="settings"></span><span class="nav-label">설정 및 상태</span></button>
  </nav><details id="sidebar-library" open><summary>플레이리스트</summary><div id="sidebar-playlists"></div></details></div>
  <button id="session-light" class="session-light" aria-label="로그인 및 상태 보기"><span class="dot"></span><span class="nav-label"><strong>계정 및 서비스</strong><small id="sidebar-session">세션 복원 중</small></span></button>
</aside>
<main class="native-content"><header class="native-toolbar"><h1 id="page-title">홈</h1></header>
<p id="notice" role="status"></p><section id="browse-view"><div id="catalog-content"></div><button id="catalog-more" hidden>더 불러오기</button></section>
<section id="tasks-view" hidden><form id="manual-form" class="manual-form"><input id="manual-url" type="url" placeholder="Apple Music 곡, 앨범 또는 플레이리스트 링크 붙여넣기" required><button type="submit" class="primary">작업에 추가</button></form><p id="jobs-status" role="status"></p><div id="jobs"></div></section>
<section id="settings-view" hidden><section class="settings-group"><h2>계정 및 서비스</h2><div class="setting-row"><div><h3 id="account-state">세션 확인 중</h3><p id="runtime-state">Windows 네이티브 서비스</p></div><button id="open-login">로그인</button><button id="recheck">다시 확인</button></div><div class="setting-row"><span>진단 로그</span><button id="export-log">진단 내보내기</button></div><div class="setting-row"><span>커뮤니티 QQ 그룹</span><span id="qq-group" title="문의 및 피드백 그룹 번호입니다. 선택하여 복사할 수 있습니다.">1131277036</span></div></section>
<section class="settings-group"><h2>다운로드</h2><div class="setting-row download-directory-row"><div><h3>다운로드 위치</h3><p id="download-directory"></p></div><button id="choose-download-directory">폴더 선택</button></div><p id="directory-feedback" role="status"></p><div class="setting-grid"><label>기본 음질<select id="quality"><option value="alac" selected>ALAC 무손실</option><option value="aac-lc">AAC-LC</option><option value="atmos">Dolby Atmos</option></select></label><label>기존 파일<select id="existing"><option value="skip">건너뛰기</option><option value="overwrite">덮어쓰기</option><option value="fail">충돌 보고</option></select></label><label>동시 다운로드<input id="concurrency" type="number" min="1" max="8" value="3"></label></div><div id="preference-fields" class="setting-grid"></div><div class="filename-builder"><h3>트랙 파일 이름</h3><input id="filename" aria-label="트랙 파일 이름 템플릿"><div id="filename-tokens"></div></div><div class="setting-row"><button id="save-settings" class="primary">설정 저장</button><button id="reset-settings">기본값 복원</button></div></section><section class="settings-group"><h2>캐시 및 미리 불러오기</h2><p id="cache-usage">캐시 사용량을 읽는 중…</p><div class="setting-row"><label>캐시 한도(MB)<input id="cache-limit" type="number" min="0" max="10240" step="50" value="500"></label><button id="save-cache-limit">용량 조정</button><button id="clear-cache">캐시 지우기</button></div><p id="cache-feedback" role="status"></p></section></section>
</main><footer id="player" hidden><div><strong id="player-title"></strong><span id="player-status"></span></div><audio id="audio" controls preload="none"></audio><button id="stop-playback" aria-label="재생 중지">✕</button></footer><script src="native-stream.js"></script><script src="native-motion.js"></script><script src="native-renderer.js"></script></body></html>
